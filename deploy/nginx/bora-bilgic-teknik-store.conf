# ---------------------------------------------------------------------------
# Bora Bilgic Teknik Store — prod nginx yapılandırması
#
# Bu dosya deploy akışına dahil DEĞİLDİR; değişiklikleri VPS üzerinde
# /etc/nginx/... altına elle kopyalayıp `sudo nginx -t && sudo systemctl
# reload nginx` ile uygulamak gerekir (bkz. deploy/README.md).
#
# TLS bu sunucuda sonlanmaz; :80 yalnızca ters proxy/CDN arkasından beslenir.
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;

  server_name borabilgic.net.tr www.borabilgic.net.tr;
  root /opt/bora-bilgic-teknik-store/current/apps/web/dist;
  index index.html;

  client_max_body_size 110m;

  # SEO: tek canonical alan adı — www her zaman apex'e yönlenir.
  if ($host = www.borabilgic.net.tr) {
    return 301 http://borabilgic.net.tr$request_uri;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;

  # Hash'li Vite çıktıları: içerik değişmedikçe sonsuz cache güvenlidir.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cloudflare R2 media. Public storefront URLs stay on borabilgic.net.tr,
  # while nginx fetches the object from the R2 public bucket origin. The first
  # three locations match the current R2_PUBLIC_BASE_URL=https://borabilgic.net.tr
  # object keys; /media/ remains for older database records and seed history.
  location /products/images/ {
    proxy_pass https://pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev/products/images/;
    proxy_ssl_server_name on;
    proxy_set_header Host pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /products/posters/ {
    proxy_pass https://pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev/products/posters/;
    proxy_ssl_server_name on;
    proxy_set_header Host pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /products/videos/ {
    proxy_pass https://pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev/products/videos/;
    proxy_ssl_server_name on;
    proxy_set_header Host pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /orders/invoices/ {
    proxy_pass https://pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev/orders/invoices/;
    proxy_ssl_server_name on;
    proxy_set_header Host pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev;
    add_header Cache-Control "private, max-age=300";
  }

  location /media/ {
    proxy_pass https://pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev/;
    proxy_ssl_server_name on;
    proxy_set_header Host pub-d17f1f58ed49462b8a262a3aa2a07ff3.r2.dev;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Dinamik sitemap API'den üretilir (admin'den eklenen ürünler otomatik girer).
  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4010/api/v1/seo/sitemap.xml;
    proxy_set_header Host $host;
  }

  # index.html asla uzun süre cache'lenmez; yeni deployun hemen görünmesini sağlar.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

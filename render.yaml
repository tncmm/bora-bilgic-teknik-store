services:
  - type: static_site
    name: bora-bilgic-teknik-store-web
    env: static
    rootDir: .
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
